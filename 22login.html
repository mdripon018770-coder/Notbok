    // --- Login Logic (Firebase Connected) ---
    window.processLogin = function() {
            const inputId = document.getElementById('login-id').value.trim();
            const inputPass = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error-message');

            if (!inputId || !inputPass) {
                errorDiv.innerText = "Please enter ID and password!";
                errorDiv.style.display = "block";
                return;
            }

            get(child(ref(db), `users/${inputId}`)).then((snapshot) => {
                if (snapshot.exists() && snapshot.val().password === inputPass) {
                    
                    // মাল্টি-ইউজারের জন্য লোকাল স্টোরেজে আইডি সেভ করা
                    localStorage.setItem('currentActiveUserID', inputId);
                    localStorage.setItem('savedUserID', inputId);
                    localStorage.setItem('savedPassword', inputPass);
                    localStorage.setItem('isLoggedIn', 'true');

                    // পুরনো টেম্পোরারি ডাটা ক্লিয়ার করা
                    localStorage.removeItem('isPhoneActivated');
                    localStorage.removeItem('userEnteredPhone');
                    localStorage.removeItem('isSecurityQuestionSaved');
                    localStorage.removeItem('userSecurityQuestion');
                    localStorage.removeItem('userSecurityAnswer');
                    localStorage.removeItem('isPasswordChanged');
                    localStorage.removeItem('passwordChangeTimestamp');
                    localStorage.removeItem('isTfaEnabled');
                    localStorage.removeItem('userProfileData');

                    // ড্যাশবোর্ড পেজে রিডাইরেক্ট
                    window.location.href = "https://mdripon018770-coder.github.io/Notbok/22.html";
                } else {
                    errorDiv.innerText = "Invalid ID or Password!";
                    errorDiv.style.display = "block";
                }
            })
            .catch((error) => {
                console.error(error);
                errorDiv.innerText = "Network error! Please try again.";
                errorDiv.style.display = "block";
            });
        };




            // --- Registration Logic ---
    // আইডি সবসময় "17" দিয়ে শুরু হবে এবং মোট ১০ ডিজিটের হবে
    window.generateUsername = () => {
        const randomPart = Math.floor(10000000 + Math.random() * 90000000).toString();
        return "17" + randomPart;
    };

    // পাসওয়ার্ডে ছোট হাতের অক্ষর, বড় হাতের অক্ষর এবং সংখ্যা থাকবে
    window.generatePassword = () => {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let pass = "";
        for (let i = 0; i < 8; i++) {
            pass += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return pass;
    };

        // চেক বক্স ভ্যালিডেশন
        if (!checkbox.checked) {

        }

        if (errorDiv) errorDiv.style.display = "none";
        if (errorIcon) errorIcon.style.display = "none";

        let password = window.generatePassword();

        // একদম সঠিক লাইভ তারিখ এবং সময় জেনারেট করার লজিক
        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const liveDate = `${dd}/${mm}/${yyyy}`; // যেমন: 07/08/2026
        const liveTime = now.toLocaleTimeString(); // বর্তমান লাইভ সময়

        // ফায়ারবেসে ডেটা সেভ করা হচ্ছে
        set(ref(db, 'users/' + username), {
            id: username,
            password: password,
            balance: 0,
            currency: selectedCurrName,
            currencySymbol: selectedCurrSymbol,
            date: liveDate, // সঠিক লাইভ ডেট
            time: liveTime  // সঠিক লাইভ সময়
        }).then(() => {
            document.getElementById("popupUser").innerText = username;
            document.getElementById("popupPass").innerText = password;
            document.getElementById("successPopup").style.display = "flex";
        });
    };

    // --- Loading & Navigation Logic ---
    window.startLoadingSequence = function() {
        const totalBalls = 8;
        const ballActiveTime = 1100; 
        function runSequence(idx) {
            if (idx > totalBalls) {
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('home-screen').style.display = 'flex';
                    document.body.style.backgroundColor = "#f0f4f7";
                }, 800);
                return;
            }
            const currentBall = document.getElementById(`b${idx}`);
            if (currentBall) currentBall.classList.add('revealed', 'active-spinning');
            setTimeout(() => {
                runSequence(idx + 1);
                setTimeout(() => {
                    if (currentBall) {
                        currentBall.classList.remove('active-spinning');
                        currentBall.classList.add('stopping-style');
                    }
                }, 150); 
            }, ballActiveTime);
        }
        runSequence(1);
    };

        document.querySelectorAll('.radio-circle').forEach(r => r.classList.remove('active'));

        document.getElementById("country-name").value = `${flag} ${name} (${code})`;
        document.getElementById("currency-select").value = currency;
        
        window.selectedCurrencyName = currency;
        const matchedCurr = currenciesList.find(c => c.name.toLowerCase() === currency.toLowerCase());
        window.selectedCurrencySymbol = matchedCurr ? matchedCurr.symbol : "$";

        document.getElementById("country-popup").style.display = "none";
    };
