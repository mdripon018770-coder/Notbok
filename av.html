<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Multi-User Synchronized</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #000; color: white; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1b1c20; border-bottom: 1px solid #2c2d30; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #e11d48; font-weight: bold; font-style: italic; font-size: 20px; }
        .balance-box { color: #28a745; font-weight: bold; font-size: 16px; background: #000; padding: 5px 15px; border-radius: 20px; border: 1px solid #333; }
        .history-bar { display: flex; gap: 8px; padding: 8px 15px; background: #050505; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #111; min-height: 40px; }
        .hist-badge { background: #1b1c20; color: #9c27b0; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid #333; flex-shrink: 0; }
        
        .game-section { height: 260px; background: #000; position: relative; margin: 5px 10px; border-radius: 15px; overflow: hidden; border: 1px solid #222; flex-shrink: 0; }
        
        .scrolling-bg {
            position: absolute; top: 0; left: 0; width: 400%; height: 100%;
            background-image: url('https://raw.githubusercontent.com/mdripon018770-coder/Notbok/main/sky_bg.png'); 
            background-repeat: repeat-x; background-size: contain; opacity: 0.4; z-index: 1; display: none;
        }

        @keyframes bgScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        #gameCanvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; }
        
        .timer-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; text-align: center; z-index: 20; display: none; }
        .progress-bg { width: 100%; height: 8px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 10px; position: relative; }
        #progress-bar { width: 100%; height: 100%; background: #ff0000; box-shadow: 0 0 15px #ff0000; transition: width 0.1s linear; }
        
        .center-display { position: absolute; top: 40%; left: 45%; transform: translate(-50%, -50%); text-align: center; z-index: 30; pointer-events: none; }
        #multiplier { font-size: 55px; font-weight: 900; color: #fff; display: none; }
        #crash-msg { color: #ff3333; font-weight: bold; font-size: 24px; display: none; text-transform: uppercase; }
        
        .plane-icon { position: absolute; z-index: 100; pointer-events: none; left: 5px; top: 195px; }
        #aviatorImg { width: 85px; height: auto; filter: drop-shadow(0 0 15px #ff0000) brightness(1.3); }

        .controls-grid { padding: 5px 10px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
        .bet-card { background: #1b1c20; border-radius: 15px; padding: 10px; border: 1px solid #2c2d30; }
        .bet-controls-row { display: flex; gap: 10px; align-items: stretch; }
        .amount-adjustment { flex: 1; display: flex; flex-direction: column; gap: 5px; background: #000; border-radius: 10px; border: 1px solid #333; padding: 5px; }
        .input-group { display: flex; align-items: center; justify-content: space-between; padding: 2px 10px; }
        .input-group button { background: #222; border: 1px solid #444; color: #fff; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }
        .input-group input { background: none; border: none; color: #fff; text-align: center; font-size: 18px; font-weight: bold; width: 60px; outline: none; }
        .quick-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .quick-chips button { background: #2c2d30; border: 1px solid #3d3e42; color: #bbb; padding: 3px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-main { width: 110px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; text-transform: uppercase; }
        .bet-btn { background: #28a745; color: white; box-shadow: 0 3px 0 #1e7e34; }
        .bet-btn:disabled { background: #444 !important; box-shadow: none !important; cursor: not-allowed; opacity: 0.5; color: #888; }
        .cash-btn { background: #ffc107; color: #000; display: none; box-shadow: 0 3px 0 #d39e00; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(0.8); } }
    </style>
</head>
<body onclick="startContinuousBGSound()">

    <div class="header">
        <div class="logo">Aviator</div>
        <div class="balance-box"><span id="main-balance">0.00</span> BDT</div>
    </div>
    <div class="history-bar" id="historyBar"></div>
    <div class="game-section">
        <div class="scrolling-bg" id="movingBg"></div>
        <canvas id="gameCanvas"></canvas>
        <div class="timer-container" id="timer-ui">
            <p style="font-size: 11px; font-weight: bold; margin-bottom: 5px;">WAITING FOR NEXT ROUND</p>
            <div class="progress-bg"><div id="progress-bar"></div></div>
        </div>
        <div class="center-display">
            <h1 id="multiplier">1.00x</h1>
            <p id="crash-msg">FLEW AWAY!</p>
        </div>
        <div id="plane" class="plane-icon">
            <img src="https://raw.githubusercontent.com/mdripon018770-coder/Notbok/main/avtor.png" id="aviatorImg" alt="Aviator Plane">
        </div>
    </div>

    <div class="controls-grid">
        <div class="bet-card">
            <div class="bet-controls-row">
                <div class="amount-adjustment">
                    <div class="input-group"><button onclick="changeAmt(1, -10)">-</button><input type="number" id="amt1" value="10" readonly><button onclick="changeAmt(1, 10)">+</button></div>
                    <div class="quick-chips"><button onclick="setAmt(1, 100)">100</button><button onclick="setAmt(1, 200)">200</button><button onclick="setAmt(1, 500)">500</button><button onclick="setAmt(1, 1000)">1000</button></div>
                </div>
                <button class="btn-main bet-btn" id="b1" onclick="handleBet(1)">BET</button>
                <button class="btn-main cash-btn" id="c1" onclick="handleCashout(1)">CASHOUT<br><span id="w1" style="font-size: 10px;"></span></button>
            </div>
        </div>
        <div class="bet-card">
            <div class="bet-controls-row">
                <div class="amount-adjustment">
                    <div class="input-group"><button onclick="changeAmt(2, -10)">-</button><input type="number" id="amt2" value="10" readonly><button onclick="changeAmt(2, 10)">+</button></div>
                    <div class="quick-chips"><button onclick="setAmt(2, 100)">100</button><button onclick="setAmt(2, 200)">200</button><button onclick="setAmt(2, 500)">500</button><button onclick="setAmt(2, 1000)">1000</button></div>
                </div>
                <button class="btn-main bet-btn" id="b2" onclick="handleBet(2)">BET</button>
                <button class="btn-main cash-btn" id="c2" onclick="handleCashout(2)">CASHOUT<br><span id="w2" style="font-size: 10px;"></span></button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, update, onValue, limitToLast, query, set, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBCjxDS76NO2ib-hW_d9TmPPNIQFnjBO3k",
        authDomain: "wallet-app-73793.firebaseapp.com",
        projectId: "wallet-app-73793",
        databaseURL: "https://wallet-app-73793-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const bgSound = new Audio('https://raw.githubusercontent.com/mdripon018770-coder/Notbok/main/aviatorbgrund.mp3');
    const crashSound = new Audio('https://raw.githubusercontent.com/mdripon018770-coder/Notbok/main/avcrsh.mp3');
    const winSound = new Audio('https://raw.githubusercontent.com/mdripon018770-coder/Notbok/main/avwin.mp3');
    bgSound.loop = true;

    window.startContinuousBGSound = function() {
        if (bgSound.paused) { bgSound.play().catch(e => {}); }
    }

    const urlParams = new URLSearchParams(window.location.search);
    let currentUser = urlParams.get('uid') || urlParams.get('id') || localStorage.getItem("userId");
    
    window.balance = 0;
    let currentMult = 1.00;
    let isFlying = false;
    let isWaiting = false;
    let gameInterval;
    let timerInterval;
    let bets = { 1: { active: false, amt: 0 }, 2: { active: false, amt: 0 } };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const plane = document.getElementById('plane');
    const movingBg = document.getElementById('movingBg');
    const multDisplay = document.getElementById('multiplier');
    const timerUI = document.getElementById('timer-ui');
    const progressBar = document.getElementById('progress-bar');
    const crashMsg = document.getElementById('crash-msg');
    const histBar = document.getElementById('historyBar');

    async function syncBetToAdmin(id, amt) {
        if (!currentUser) return;
        await set(ref(db, `active_bets/${currentUser}_${id}`), {
            userName: currentUser, amount: amt, balance: window.balance.toFixed(2), lastWinAmount: 0 
        });
    }

    async function removeBetFromAdmin(id) {
        if (!currentUser) return;
        await remove(ref(db, `active_bets/${currentUser}_${id}`));
    }

    function toggleBetButtons(disable) {
        document.getElementById('b1').disabled = disable;
        document.getElementById('b2').disabled = disable;
    }

    onValue(query(ref(db, 'game_history'), limitToLast(20)), (snapshot) => {
        const data = snapshot.val();
        if (data) {
            histBar.innerHTML = '';
            Object.values(data).reverse().forEach(point => {
                let nb = document.createElement('span');
                nb.className = 'hist-badge';
                nb.innerText = parseFloat(point).toFixed(2) + 'x';
                histBar.appendChild(nb);
            });
        }
    });

    if (currentUser) {
        onValue(ref(db, `users/${currentUser}`), (snap) => {
            if (snap.exists()) {
                const userData = snap.val();
                window.balance = parseFloat(userData.balance || 0);
                const balEl = document.getElementById("main-balance");
                if (balEl) balEl.innerText = window.balance.toFixed(2);
            }
        });
    }

    async function syncBalance(newBal) {
        if (currentUser) {
            await update(ref(db, `users/${currentUser}`), { balance: parseFloat(newBal.toFixed(2)) });
        }
    }

    // FIREBASE STATE LISTENER
    onValue(ref(db, 'game_state'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        let now = Date.now();
        
        if (data.status === "waiting") {
            let elapsed = (now - data.startTime) / 1000;
            let remaining = 5 - elapsed; 
            startTimerSync(remaining, data.startTime);
        } else if (data.status === "flying") {
            let elapsed = (now - data.startTime) / 1000;
            let syncMult = 1 + (elapsed * 0.30);
            if (syncMult < data.crashAt) {
                startFlightSync(syncMult, data.crashAt, data.startTime);
            } else {
                finishGameSync(data.crashAt);
            }
        }
    });

    function startTimerSync(rem, startTime) {
        if(isWaiting) return;
        isWaiting = true; isFlying = false;
        clearInterval(gameInterval);
        clearInterval(timerInterval);
        
        movingBg.style.display = 'none';
        toggleBetButtons(false);
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        
        timerUI.style.display = 'block';
        multDisplay.style.display = 'none';
        crashMsg.style.display = 'none';
        plane.style.display = 'block';
        plane.style.transition = "none"; 
        plane.style.left = "5px";
        plane.style.top = "195px"; 

        timerInterval = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;
            let totalWait = 5; 
            let remaining = totalWait - elapsed;
            
            if(remaining <= 0) {
                progressBar.style.width = "0%";
                clearInterval(timerInterval);
                isWaiting = false;
            } else {
                let percentage = (remaining / totalWait) * 100;
                progressBar.style.width = percentage + "%";
            }
        }, 50);
    }

    function startFlightSync(startAt, crashPoint, startTime) {
        if(isFlying) return;
        isFlying = true; isWaiting = false;
        clearInterval(timerInterval);
        toggleBetButtons(true);
        movingBg.style.display = 'block';
        movingBg.style.animation = 'bgScroll 8s linear infinite';
        timerUI.style.display = 'none';
        multDisplay.style.display = 'block';
        multDisplay.style.color = 'white';

        gameInterval = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;
            currentMult = 1 + (elapsed * 0.30);
            
            if (currentMult >= crashPoint) {
                finishGameSync(crashPoint);
                return;
            }
            multDisplay.innerText = currentMult.toFixed(2) + "x";

            let limitX = canvas.width * 0.7; 
            let prog = Math.min((currentMult - 1) / 4, 1); 
            let x = 5 + (prog * limitX);
            let wave = Math.sin(elapsed * 2) * 8; 
            let y = (195 - (Math.pow(prog, 0.5) * 165)) + wave; 
            
            plane.style.left = x + 'px';
            plane.style.top = y + 'px';
            renderCanvas(x + 35, y + 55);

            if(bets[1].active) document.getElementById('w1').innerText = (bets[1].amt * currentMult).toFixed(2);
            if(bets[2].active) document.getElementById('w2').innerText = (bets[2].amt * currentMult).toFixed(2);
        }, 50);
    }

    function finishGameSync(point) {
        if(!isFlying) return;
        clearInterval(gameInterval);
        isFlying = false; isWaiting = false;
        movingBg.style.animationPlayState = 'paused'; 
        crashSound.play();
        crashMsg.style.display = 'block';
        multDisplay.innerText = point.toFixed(2) + "x";
        multDisplay.style.color = '#ff3333';
        
        if(bets[1].active) removeBetFromAdmin(1);
        if(bets[2].active) removeBetFromAdmin(2);
        bets[1].active = false; bets[2].active = false;
        
        document.getElementById('b1').style.display = 'block';
        document.getElementById('c1').style.display = 'none';
        document.getElementById('b2').style.display = 'block';
        document.getElementById('c2').style.display = 'none';
        
        plane.style.transition = "all 0.8s ease-in";
        plane.style.left = (window.innerWidth + 200) + "px"; 
        plane.style.top = "-100px";
        
        setTimeout(() => { 
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            plane.style.display = "none";
            movingBg.style.display = 'none';
        }, 800);
    }

    function renderCanvas(x, y) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let grad = ctx.createLinearGradient(0, canvas.height, 0, y);
        grad.addColorStop(0, "rgba(220, 0, 0, 0.8)"); 
        grad.addColorStop(1, "transparent");
        ctx.beginPath(); 
        ctx.moveTo(0, canvas.height); 
        ctx.quadraticCurveTo(x/3, canvas.height, x, y); 
        ctx.lineTo(x, canvas.height); 
        ctx.fillStyle = grad; ctx.fill();
        ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = "#ff0000"; ctx.lineCap = "round";
        ctx.moveTo(0, canvas.height); ctx.quadraticCurveTo(x/3, canvas.height, x, y); ctx.stroke();
    }

    window.changeAmt = (id, val) => {
        let input = document.getElementById('amt' + id);
        let cur = parseInt(input.value);
        if(cur + val >= 10) input.value = cur + val;
    }
    window.setAmt = (id, val) => { document.getElementById('amt' + id).value = val; }
    
    window.handleBet = async function(id) {
        startContinuousBGSound();
        let amt = parseFloat(document.getElementById('amt' + id).value);
        if(window.balance < amt) { Swal.fire({ text: "Low Balance!", icon: 'error' }); return; }
        await syncBalance(window.balance - amt);
        await syncBetToAdmin(id, amt);
        bets[id].active = true; bets[id].amt = amt;
        document.getElementById('b' + id).style.display = 'none';
        document.getElementById('c' + id).style.display = 'block';
    };

    window.handleCashout = async function(id) {
        if(!isFlying || !bets[id].active) return;
        winSound.currentTime = 0; winSound.play();
        let winAmt = bets[id].amt * currentMult;
        showWinAnimation(winAmt);
        await syncBalance(window.balance + winAmt);
        if (currentUser) {
            await update(ref(db, `active_bets/${currentUser}_${id}`), {
                lastWinAmount: winAmt.toFixed(2),
                balance: (window.balance + winAmt).toFixed(2)
            });
        }
        setTimeout(async () => { await removeBetFromAdmin(id); }, 3000);
        bets[id].active = false;
        document.getElementById('b' + id).style.display = 'block';
        document.getElementById('c' + id).style.display = 'none';
        document.getElementById('b' + id).disabled = true;
    }

    function showWinAnimation(amount) {
        const winMsg = document.createElement('div');
        winMsg.style.cssText = `position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(40, 167, 69, 0.9); color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; z-index: 10001; animation: fadeInOut 2s forwards;`;
        winMsg.innerText = `YOU WON: ৳${amount.toFixed(2)}`;
        document.body.appendChild(winMsg);
        setTimeout(() => { winMsg.remove(); }, 2000);
    }

    function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
</script>

</body>
</html>
