<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Premium Earn App</title>
    
    <!-- SweetAlert2 CDN যোগ করা হয়েছে -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #7b2cbf, #5a189a); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 40px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); width: 300px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        h2 { color: white; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 2px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #27ae60; border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 280px; }
        .modal-content input { border: 2px solid #ccc; outline: none; }
        .modal-content input:focus { border-color: #f1c40f; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        <input type="number" id="phone" placeholder="Phone Number">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">LOGIN NOW</button>
        <div style="margin-top: 20px;">
            <button onclick="openRegister()" style="background: transparent; border: 1px solid white;">Register</button>
        </div>
    </div>

    <div id="regModal" class="modal">
    <div class="modal-content">
        <h3>Register</h3>
        <input type="text" id="regName" placeholder="Name">
        <input type="number" id="regPhone" placeholder="Phone Number">
        <input type="password" id="regPass" placeholder="Password">
        <input type="password" id="regConfirm" placeholder="Confirm Password">
        <input type="text" id="regRefer" placeholder="Referral Code (Optional)">
        <button onclick="register()">REGISTER</button>
        <button onclick="closeRegister()" style="background:red; margin-top:5px; border:none; color:white; padding:10px; width:100%; cursor:pointer;">Close</button>
    </div>
</div>


                <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, increment } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
    databaseURL: "https://amar-bazar-d99b4-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// এখন আপনি আপনার কোডে যেকোনো জায়গায় ব্যালেন্স আপডেট করতে 'increment(10)' ব্যবহার করতে পারবেন।
// যেমন: 
// await set(ref(db, "users/" + referrerKey + "/balance"), increment(10));

// =======================
// AUTO LOGIN
// =======================
window.onload = function () {
    const isLoggedIn = localStorage.getItem("isLoggedIn");
    if (isLoggedIn === "true") {
        window.location.replace("https://mdripon018770-coder.github.io/Notbok/task.html");
        return;
    }
    document.getElementById("phone").value = localStorage.getItem("userPhone") || "";
};

// =======================
// REGISTER POPUP
// =======================
window.openRegister = () => { document.getElementById("regModal").style.display = "flex"; };
window.closeRegister = () => { document.getElementById("regModal").style.display = "none"; };

// =======================
// REFER LOGIC (New)
// =======================
window.generateReferCode = (name) => {
    const randomNum = Math.floor(1000 + Math.random() * 9000);
    return (name ? name.substring(0, 3).toUpperCase() : "USR") + randomNum;
};

// =======================
// REGISTER (Updated)
// =======================
window.register = async () => {
    const name = document.getElementById("regName").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const pass = document.getElementById("regPass").value;
    const confirm = document.getElementById("regConfirm").value;
    const refCode = document.getElementById("regRefer").value.trim();

    if (!name || !phone || !pass || !confirm) {
        Swal.fire("Error", "সব তথ্য পূরণ করুন", "error");
        return;
    }
    if (pass !== confirm) {
        Swal.fire("Error", "Passwords do not match!", "error");
        return;
    }

    const userRef = ref(db, "users/" + phone);
    const snap = await get(userRef);

    if (snap.exists()) {
        Swal.fire("Error", "এই নম্বরে ইতোমধ্যে অ্যাকাউন্ট আছে!", "error");
        return;
    }

    let myCode = generateReferCode(name);
    let userData = {
        name: name,
        balance: 0,
        password: pass,
        regTime: Date.now(),
        referCode: myCode,
        referredBy: refCode || "none"
    };

    // রেফারেল লজিক
    if (refCode !== "") {
        const allUsersRef = ref(db, "users");
        const allUsersSnap = await get(allUsersRef);
        let referrerFoundKey = null;

        allUsersSnap.forEach((child) => {
            if (child.val().referCode === refCode) {
                referrerFoundKey = child.key;
            }
        });

        if (!referrerFoundKey) {
            Swal.fire("Error", "ভুল রেফার কোড!", "error");
            return;
        }

        if (referrerFoundKey === phone) {
            Swal.fire("Error", "নিজের রেফার কোড নিজে ব্যবহার করা যাবে না!", "error");
            return;
        }

        // বোনাস লজিক: রেফারারকে ১০ টাকা, নতুন ইউজারকে ৫ টাকা
        const referrerBalance = allUsersSnap.val()[referrerFoundKey].balance || 0;
        await set(ref(db, "users/" + referrerFoundKey + "/balance"), referrerBalance + 10);
        
        // অ্যানিমেশন ট্রিগার করার জন্য এটি যুক্ত করা হলো
        await set(ref(db, "users/" + referrerFoundKey + "/showAnimation"), true);
        
        userData.balance = 5; 
    }

    await set(userRef, userData);

    localStorage.setItem("userPhone", phone);
    localStorage.setItem("isLoggedIn", "true");

    Swal.fire("Success", "Registration Successful!", "success").then(() => {
        window.location.replace("https://mdripon018770-coder.github.io/Notbok/task.html");
    });
};


// =======================
// LOGIN (Updated)
// =======================
window.login = async () => {
    const phone = document.getElementById("phone").value.trim();
    const pass = document.getElementById("password").value;

    if (!phone || !pass) {
        Swal.fire("Error", "Phone এবং Password দিন", "error");
        return;
    }

    const snap = await get(ref(db, "users/" + phone));

    if (!snap.exists()) {
        Swal.fire({ icon: "error", title: "Failed", text: "Account not found!" });
        return;
    }

    const user = snap.val();

    if (user.password !== pass) {
        Swal.fire({ icon: "error", title: "Failed", text: "Wrong password!" });
        return;
    }

    localStorage.setItem("userPhone", phone);
    localStorage.setItem("userName", user.name);
    localStorage.setItem("userPass", pass);
    localStorage.setItem("isLoggedIn", "true");

    Swal.fire({
        icon: "success",
        title: "Login Successful",
        timer: 800,
        showConfirmButton: false
    }).then(() => {
        window.location.replace("https://mdripon018770-coder.github.io/Notbok/task.html");
    });
};

// এই পেজে রেফার কোড কপি করার প্রয়োজন নেই, তাই ফাংশনটি task.html এ রাখলে ভালো
window.copyReferCode = () => {
    const code = document.getElementById('myReferCode').innerText;
    navigator.clipboard.writeText(code);
    Swal.fire({ icon: 'success', title: 'কপি হয়েছে!', text: 'কোডটি ক্লিপবোর্ডে কপি করা হয়েছে।', timer: 1500 });
};
</script>

</body>
</html>
