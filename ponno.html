<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    
        <style>
    body { font-family: sans-serif; background: #f8d7da; margin: 0; padding: 20px; }
    
    .search-box { 
        width: 90%; display: block; margin: 0 auto 20px auto; padding: 12px; 
        border: none; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }

    /* প্রোডাক্ট গ্রিড */
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .product-card { 
        background: #d3dce6; padding: 12px; border-radius: 20px; 
        text-align: center; display: flex; flex-direction: column;
    }
    
    /* ইমেজ লম্বা করার জন্য height বাড়ানো হয়েছে */
    .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; margin-bottom: 10px; }
    
    .product-title { font-size: 14px; font-weight: bold; margin: 5px 0; }
    .price-text { font-size: 14px; color: #1a2a6c; margin: 2px 0; }
    .cashback-text { font-size: 12px; color: #27ae60; font-weight: bold; margin-bottom: 8px; }
    
    /* বাটন ডিজাইন */
    .order-btn-custom { 
        background: #5a189a; color: white; border: none; padding: 8px; 
        border-radius: 15px; cursor: pointer; font-size: 13px; font-weight: bold;
    }

    /* কার্ডের ভেতরের টেক্সট এবং বাটনের স্টাইল */
    .product-title { 
        font-size: 16px; 
        font-weight: 700; 
        color: #2d3436; 
        margin-bottom: 8px; 
        display: block;
    }

    .price-text { 
        font-size: 15px; 
        color: #636e72; 
        margin: 2px 0; 
    }

    .cashback-text { 
        font-size: 14px; 
        color: #00b894; 
        font-weight: 600; 
        margin-bottom: 12px; 
        background: #e0f2f1; /* হালকা ব্যাকগ্রাউন্ড কালার */
        padding: 4px 8px;
        border-radius: 6px;
        display: inline-block;
    }

    .order-btn-custom { 
        background: linear-gradient(135deg, #6c5ce7, #a29bfe); /* প্রিমিয়াম গ্রেডিয়েন্ট বাটন */
        color: white; 
        border: none; 
        padding: 10px 20px; 
        border-radius: 12px; 
        cursor: pointer; 
        font-size: 14px; 
        font-weight: bold;
        transition: transform 0.2s;
        box-shadow: 0 4px 6px rgba(108, 92, 231, 0.3);
    }

    .order-btn-custom:active { transform: scale(0.95); } /* ক্লিক করলে বাটনটি একটু ছোট হবে */



/* মোডাল ওভারলে - এটি পপআপকে পুরো স্ক্রিনে কভার করবে এবং সেন্টার করবে */
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0, 0, 0, 0.7); /* ব্যাকগ্রাউন্ড কালার */
    justify-content: center; 
    align-items: center; 
    z-index: 9999; /* যেন সবার উপরে থাকে */
}

/* মোডাল কন্টেন্ট - ফর্মের ডিজাইন */
.modal-content {
    background: white; 
    padding: 20px; 
    border-radius: 20px; 
    width: 85%; 
    max-width: 400px; 
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ইনপুট ফিল্ডের ডিজাইন */
.input-field {
    width: 100%; 
    padding: 12px; 
    margin: 8px 0; 
    border: 1px solid #ddd; 
    border-radius: 12px; 
    box-sizing: border-box; /* যেন বর্ডার ফিল্ডের বাইরে না যায় */
}

.search-container {
    position: relative;
    width: 90%;
    margin: 0 auto 20px auto;
}
.search-box {
    width: 100%;
    padding: 12px 45px 12px 20px; /* ডানে জায়গা রাখা হয়েছে */
    border: none;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    box-sizing: border-box;
}
.camera-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    cursor: pointer;
}

    </style>
</head>
<body>

<!-- ব্যালেন্স ডিসপ্লে (এটি হিডেন থাকবে অথবা আপনি আপনার ডিজাইনের কোথাও ছোট করে রাখতে পারেন) -->
<div style="display:none;">
    ৳ <span id="balance-display">0.00</span>
</div>

<div class="notice-board">
    <marquee behavior="scroll" direction="left" scrollamount="5">
        📢 বিশেষ অফার: প্রোডাক্ট অর্ডারে পাবেন সর্বোচ্চ ক্যাশব্যাক! | প্রতিদিন নতুন নতুন টাস্ক সম্পন্ন করুন এবং আয় করুন! | কোনো সমস্যা হলে এডমিনের সাথে যোগাযোগ করুন।
    </marquee>
</div>

    <div class="search-container">
    <input type="text" id="search-box" class="search-box" placeholder="Search for a shop">
    <img src="https://cdn-icons-png.flaticon.com/512/1086/1086915.png" class="camera-icon">
    <div id="search-history" style="display:none; background: white; border-radius: 10px; padding: 10px; margin-top: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
</div>

    <div class="product-grid" id="product-container">
    <!-- এখানে ডাইনামিকলি প্রোডাক্ট আসবে -->
</div>


<div id="orderModal" class="modal-overlay">
    <div class="modal-content">
        <div style="display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
            <div id="user-logo" style="width: 50px; height: 50px; background: #7b2cbf; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; margin-right: 15px;">
                </div>
            <div>
                <div id="modal-user-name" style="font-weight: bold; font-size: 16px;">Loading...</div>
                <div id="modal-user-phone" style="color: #666; font-size: 14px;">Loading...</div>
            </div>
        </div>

        <h3 style="margin-top:0;">অর্ডার ফর্ম</h3>
        <input type="text" id="userName" class="input-field" placeholder="আপনার নাম">
        <input type="text" id="userPhone" class="input-field" placeholder="আপনার ফোন নম্বর">
        <input type="text" id="userAddress" class="input-field" placeholder="আপনার এলাকা">
        
        <button class="order-btn-custom" onclick="sendOrderProcess()" style="width:100%; margin-top:10px;">Confirm Order</button>
        <button class="order-btn-custom" style="background:#ff4757; width:100%; margin-top:10px;" onclick="closeModal()">Cancel</button>
    </div>
</div>


    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://amar-bazar-d99b4-default-rtdb.firebaseio.com" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userPhone = localStorage.getItem("userPhone");
    if (!userPhone) {
        window.location.replace("https://mdripon018770-coder.github.io/Notbok/tasklogin.html");
    }

    // ব্যালেন্স সিঙ্ক
    onValue(ref(db, 'users/' + userPhone + '/balance'), (snapshot) => {
        const balance = snapshot.val() || 0;
        document.getElementById('balance-display').innerText = parseFloat(balance).toLocaleString("en-BD", { minimumFractionDigits: 2 });
    });

    // প্রোডাক্ট লোড করা
    onValue(ref(db, 'products'), (snapshot) => {
        const container = document.getElementById('product-container');
        container.innerHTML = ''; 
        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-name', data.name || "");
            card.setAttribute('data-tags', data.tags || "");

            card.innerHTML = `
                <img src="${data.imageUrl}" class="product-img">
                <span class="product-title">${data.name}</span>
                <div class="price-text">Price: ৳ ${data.price}</div>
                <div class="cashback-text">Cashback: ৳ ${data.cashback}</div>
                <button class="order-btn-custom btn-order" data-name="${data.name}" data-cashback="${data.cashback}">Order Now</button>
            `;
            container.appendChild(card);
        });
    });

    // মোডাল এবং অর্ডার লজিক হ্যান্ডল করার জন্য ইভেন্ট ডেলিগেশন
        // মোডাল এবং অর্ডার লজিক
    let currentProduct = "";
    let currentCashback = 0;

    document.addEventListener('click', async function(e) {
        // অর্ডার বাটন ক্লিক চেক
        if (e.target.classList.contains('btn-order')) {
            currentProduct = e.target.getAttribute('data-name');
            currentCashback = e.target.getAttribute('data-cashback');
            
            // Firebase থেকে ওই ইউজারের ডাটা আনা
            const userRef = ref(db, 'users/' + userPhone);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    const name = userData.name || "User";
                    document.getElementById('modal-user-name').innerText = name;
                    document.getElementById('modal-user-phone').innerText = userPhone;
                    document.getElementById('user-logo').innerText = name.charAt(0).toUpperCase();
                    document.getElementById('userName').value = name;
                    document.getElementById('userPhone').value = userPhone;
                }
            }, { onlyOnce: true });

            document.getElementById('orderModal').style.display = 'flex';
        }
        
        // ক্লোজ বাটন ক্লিক চেক
        if (e.target.innerText === 'Cancel') {
            document.getElementById('orderModal').style.display = 'none';
        }

        // কনফার্ম অর্ডার ক্লিক চেক
        if (e.target.innerText === 'Confirm Order') {
            await sendOrderProcess();
        }
    });

    async function sendOrderProcess() {
        let name = document.getElementById('userName').value;
        let phone = document.getElementById('userPhone').value;
        let address = document.getElementById('userAddress').value;

        if (!name || !phone || !address) {
            Swal.fire({ icon: 'warning', title: 'তথ্য ভুল!', text: 'দয়া করে সব তথ্য পূরণ করুন!' });
            return;
        }

        Swal.fire({ title: 'অর্ডার প্রসেস হচ্ছে...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        try {
            const orderData = {
                userId: userPhone,
                product: currentProduct,
                userName: name,
                userPhone: phone,
                userAddress: address,
                cashback: currentCashback,
                status: 'Pending',
                timestamp: new Date().toLocaleString('bn-BD')
            };

            await push(ref(db, 'orders'), orderData);
            await push(ref(db, 'users/' + userPhone + '/history'), orderData);

            let msg = `নতুন অর্ডার: ${currentProduct}%0Aনাম: ${name}%0Aফোন: ${phone}%0Aঠিকানা: ${address}`;
            window.open(`https://wa.me/8801877059049?text=${msg}`, '_blank');

            Swal.fire({ icon: 'success', title: 'অর্ডার সফল!', text: 'অর্ডারটি জমা হয়েছে।' });
            
            document.getElementById('orderModal').style.display = 'none';
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'ভুল হয়েছে!', text: 'আবার চেষ্টা করুন।' });
        }
    }



    // সার্চ লজিক
    const searchBox = document.getElementById('search-box');
const historyDiv = document.getElementById('search-history');

// সার্চ বক্সে ক্লিক করলে হিস্ট্রি দেখাবে
searchBox.addEventListener('focus', () => {
    historyDiv.style.display = 'block';
});

// বাইরে ক্লিক করলে হিস্ট্রি হাইড হবে
document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-container')) {
        historyDiv.style.display = 'none';
    }
});

// সার্চ করলে ফায়ারবেসে সেভ হবে
searchBox.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const term = searchBox.value;
        if(term) {
            push(ref(db, 'users/' + userPhone + '/searchHistory'), { term: term, time: Date.now() });
        }
    }
});

// ফায়ারবেস থেকে হিস্ট্রি লোড করে দেখানো
onValue(ref(db, 'users/' + userPhone + '/searchHistory'), (snapshot) => {
    historyDiv.innerHTML = '';
    snapshot.forEach((child) => {
        const item = document.createElement('div');
        item.innerText = child.val().term;
        item.style.padding = "5px";
        item.onclick = () => { searchBox.value = child.val().term; };
        historyDiv.appendChild(item);
    });
});


window.closeModal = () => {
    document.getElementById('orderModal').style.display = 'none';
};


    </script>
</body>
</html>
